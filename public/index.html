<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>donguri</title>

    <!-- Theme flash prevention: read cookie before any rendering -->
    <script>
      (function() {
        var theme = document.cookie.split('; ').find(function(c) { return c.startsWith('theme='); });
        var value = theme ? theme.split('=')[1] : null;
        if (!value) {
          value = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.className = value;
      })();
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              mono: ['IBM Plex Mono', 'monospace'],
            },
            colors: {
              kanagawa: {
                // Dark mode
                'bg-base': '#1f1f28',
                'bg-elevated': '#2a2a37',
                'bg-surface': '#363646',
                'text-primary': '#dcd7ba',
                'text-secondary': '#727169',
                'accent-blue': '#7e9cd8',
                'accent-cyan': '#7fb4ca',
                'accent-green': '#98bb6c',
                'accent-yellow': '#e6c384',
                'accent-orange': '#ffa066',
                'accent-red': '#ff5d62',
                // Light mode
                'light-bg-base': '#f2ecbc',
                'light-bg-elevated': '#e7dba0',
                'light-bg-surface': '#d5cea3',
                'light-text-primary': '#1f1f28',
                'light-text-secondary': '#727169',
                'light-accent-blue': '#4e8ca2',
                'light-accent-cyan': '#597b8c',
                'light-accent-green': '#6f894e',
                'light-accent-yellow': '#a96b2c',
                'light-accent-orange': '#cc6d00',
                'light-accent-red': '#c84053',
              }
            }
          }
        }
      }
    </script>

    <style>
      /* IBM Plex Mono font-face */
      @font-face {
        font-family: 'IBM Plex Mono';
        src: url('/fonts/IBMPlexMono-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        src: url('/fonts/IBMPlexMono-Medium.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        src: url('/fonts/IBMPlexMono-SemiBold.woff2') format('woff2');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }

      /* Base styles */
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: 'IBM Plex Mono', monospace;
      }

      /* Custom scrollbar for dark mode */
      .dark ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .dark ::-webkit-scrollbar-track {
        background: #1f1f28;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #363646;
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #54546d;
      }

      /* Light mode scrollbar */
      .light ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .light ::-webkit-scrollbar-track {
        background: #f2ecbc;
      }
      .light ::-webkit-scrollbar-thumb {
        background: #d5cea3;
        border-radius: 4px;
      }
      .light ::-webkit-scrollbar-thumb:hover {
        background: #c9c093;
      }

      /* TUI loading animation */
      @keyframes tui-loading {
        0% { content: '[      ]'; }
        16% { content: '[=     ]'; }
        33% { content: '[==    ]'; }
        50% { content: '[===   ]'; }
        66% { content: '[====  ]'; }
        83% { content: '[===== ]'; }
        100% { content: '[======]'; }
      }
      .tui-loading::after {
        content: '[      ]';
        animation: tui-loading 1s steps(1) infinite;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
