<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>donguri</title>

    <!-- Theme flash prevention: read cookie before any rendering -->
    <script>
      (function() {
        var theme = document.cookie.split('; ').find(function(c) { return c.startsWith('theme='); });
        var value = theme ? theme.split('=')[1] : null;
        if (!value) {
          value = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.className = value;
      })();
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              mono: ['IBM Plex Mono', 'monospace'],
            },
            colors: {
              kanagawa: {
                // Dark mode - deeper, warmer (gruvbox-inspired)
                'bg-base': '#1a1816',
                'bg-elevated': '#242220',
                'bg-surface': '#32302e',
                'text-primary': '#c5b89a',
                'text-secondary': '#7c7065',
                'accent-blue': '#7daea3',
                'accent-cyan': '#89b482',
                'accent-green': '#a9b665',
                'accent-yellow': '#d8a657',
                'accent-orange': '#e78a4e',
                'accent-red': '#ea6962',
                // Light mode - warm cream with saturated accents
                'light-bg-base': '#f5f0e1',
                'light-bg-elevated': '#ebe6d5',
                'light-bg-surface': '#dfd9c8',
                'light-text-primary': '#4a4540',
                'light-text-secondary': '#8a8278',
                'light-accent-blue': '#3a7a8c',
                'light-accent-cyan': '#4e8f6a',
                'light-accent-green': '#6a8c35',
                'light-accent-yellow': '#b5762e',
                'light-accent-orange': '#c45a2c',
                'light-accent-red': '#b83b3b',
              }
            }
          }
        }
      }
    </script>

    <style>
      /* IBM Plex Mono font-face */
      @font-face {
        font-family: 'IBM Plex Mono';
        src: url('/fonts/IBMPlexMono-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        src: url('/fonts/IBMPlexMono-Medium.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        src: url('/fonts/IBMPlexMono-SemiBold.woff2') format('woff2');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }

      /* Base styles */
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: 'IBM Plex Mono', monospace;
      }

      /* Custom scrollbar for dark mode */
      .dark ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .dark ::-webkit-scrollbar-track {
        background: #1a1816;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #32302e;
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #45423e;
      }

      /* Light mode scrollbar */
      .light ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      .light ::-webkit-scrollbar-track {
        background: #f5f0e1;
      }
      .light ::-webkit-scrollbar-thumb {
        background: #dfd9c8;
        border-radius: 4px;
      }
      .light ::-webkit-scrollbar-thumb:hover {
        background: #d0c9b8;
      }

      /* TUI loading animation */
      @keyframes tui-loading {
        0% { content: '[      ]'; }
        16% { content: '[=     ]'; }
        33% { content: '[==    ]'; }
        50% { content: '[===   ]'; }
        66% { content: '[====  ]'; }
        83% { content: '[===== ]'; }
        100% { content: '[======]'; }
      }
      .tui-loading::after {
        content: '[      ]';
        animation: tui-loading 1s steps(1) infinite;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
